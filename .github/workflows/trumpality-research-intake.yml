name: Trumpality Research Intake

on:
  workflow_dispatch:
    inputs:
      producer_commit:
        description: "Full Trumpality commit SHA to ingest (pinned; branch names are refused)"
        required: true
  schedule:
    - cron: '35 */6 * * *'
  pull_request:
    paths:
      - "scripts/intake_trumpality_research_candidates.py"
      - "tests/test_trumpality_research_intake.py"
      - ".github/workflows/trumpality-research-intake.yml"

permissions:
  contents: write

concurrency:
  group: trumpality-research-intake-${{ github.ref }}
  cancel-in-progress: false

jobs:
  intake-readback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: ${{ github.event_name != 'pull_request' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Intake regression tests (stdlib unittest)
        run: python tests/test_trumpality_research_intake.py -v
      - name: Live intake and readback of pinned acquisition cycles (read-only)
        if: github.event_name == 'pull_request'
        env:
          # Two consecutive hosted acquisition cycles on Trumpality PR #9 (runs 38316895463, 38316949141).
          VERIFY_COMMITS: bdbdc922f4d57dd690e707b82f275b5c0721e96f 60e90aacf4eec0c5011214577d243e4c86f3af61
        run: |
          for c in ${VERIFY_COMMITS}; do
            python scripts/intake_trumpality_research_candidates.py intake --producer-commit "$c"
          done
          python scripts/intake_trumpality_research_candidates.py readback --output "${RUNNER_TEMP}/readback.json"
          python - <<'PY2'
          import json, os
          r = json.load(open(os.path.join(os.environ['RUNNER_TEMP'], 'readback.json')))
          assert r['append_only_verified'] is True, r
          assert r['finding_authorized'] is False and r['publication_authorized'] is False
          print(json.dumps({k: v for k, v in r.items() if k != 'trajectories'}, sort_keys=True))
          PY2
      - name: Resolve pinned producer commit
        if: github.event_name != 'pull_request'
        id: producer
        env:
          INPUT_COMMIT: ${{ github.event.inputs.producer_commit }}
        run: |
          commit="${INPUT_COMMIT}"
          if [ -z "${commit}" ]; then
            commit=$(git ls-remote https://github.com/StegVerse-Labs/Trumpality refs/heads/main | cut -f1)
          fi
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
      - name: Intake producer candidates and scan receipts
        if: github.event_name != 'pull_request'
        run: python scripts/intake_trumpality_research_candidates.py intake --producer-commit "${{ steps.producer.outputs.commit }}"
      - name: Read back lane evidence
        if: github.event_name != 'pull_request'
        run: |
          python scripts/intake_trumpality_research_candidates.py readback \
            --output research-data/trumpality-acquisition/ERL-RC-TRUMP-FAMILY-CRYPTO-MARKET-2026/readback.json
      # Runs on failure too: a FAIL_CLOSED disposition is retained evidence of the attempted transition.
      - name: Persist append-only intake and transition dispositions
        if: always() && github.event_name != 'pull_request'
        run: |
          git config user.name 'stegverse-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research-data/trumpality-acquisition
          if git diff --cached --quiet; then
            echo 'No intake change to persist.'
          else
            git commit -m "research: intake Trumpality candidates at ${{ steps.producer.outputs.commit }}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
