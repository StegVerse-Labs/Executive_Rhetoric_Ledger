name: Trumpality Research Intake

on:
  workflow_dispatch:
    inputs:
      producer_commit:
        description: "Full Trumpality commit SHA to ingest (pinned; branch names are refused)"
        required: true
  schedule:
    - cron: '35 */6 * * *'
  pull_request:
    paths:
      - "scripts/intake_trumpality_research_candidates.py"
      - "tests/test_trumpality_research_intake.py"
      - ".github/workflows/trumpality-research-intake.yml"

permissions:
  contents: write

concurrency:
  group: trumpality-research-intake-${{ github.ref }}
  cancel-in-progress: false

jobs:
  intake-readback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: ${{ github.event_name != 'pull_request' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: Intake regression tests
        run: python -m pytest -q tests/test_trumpality_research_intake.py
      - name: Resolve pinned producer commit
        if: github.event_name != 'pull_request'
        id: producer
        env:
          INPUT_COMMIT: ${{ github.event.inputs.producer_commit }}
        run: |
          commit="${INPUT_COMMIT}"
          if [ -z "${commit}" ]; then
            commit=$(git ls-remote https://github.com/StegVerse-Labs/Trumpality refs/heads/main | cut -f1)
          fi
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
      - name: Intake producer candidates and scan receipts
        if: github.event_name != 'pull_request'
        run: python scripts/intake_trumpality_research_candidates.py intake --producer-commit "${{ steps.producer.outputs.commit }}"
      - name: Read back lane evidence
        if: github.event_name != 'pull_request'
        run: |
          python scripts/intake_trumpality_research_candidates.py readback \
            --output research-data/trumpality-acquisition/ERL-RC-TRUMP-FAMILY-CRYPTO-MARKET-2026/readback.json
      - name: Persist append-only intake
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'stegverse-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research-data/trumpality-acquisition
          if git diff --cached --quiet; then
            echo 'No intake change to persist.'
          else
            git commit -m "research: intake Trumpality candidates at ${{ steps.producer.outputs.commit }}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
