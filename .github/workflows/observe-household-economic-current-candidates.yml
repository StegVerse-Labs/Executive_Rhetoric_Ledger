name: Observe Household Economic Current Candidates

on:
  pull_request:
    paths:
      - "scripts/acquire_household_economic_conditions.py"
      - "scripts/acquire_board_dsr.py"
      - "scripts/acquire_census_b25140.py"
      - "scripts/inspect_nyfed_household_workbook.py"
      - "scripts/normalize_nyfed_household_workbook.py"
      - "scripts/extract_nyfed_distributional_context.py"
      - "scripts/augment_household_economic_state_candidate.py"
      - "scripts/build_household_economic_state_candidate.py"
      - "research-data/household-economic-conditions/**"
      - ".github/workflows/observe-household-economic-current-candidates.yml"
  workflow_dispatch:

permissions: {}

jobs:
  observe-public-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install workbook parser
        run: python -m pip install --upgrade openpyxl
      - name: Acquire current BLS candidates without credentials
        run: python scripts/acquire_household_economic_conditions.py --source bls --start-year 2025 --end-year 2026 --output-dir build/household-economic-source-candidates/bls
      - name: Acquire Federal Reserve Board DSR candidates without credentials
        run: python scripts/acquire_board_dsr.py --output-dir build/household-economic-source-candidates/fred
      - name: Acquire latest standard ACS candidate without credentials
        run: python scripts/acquire_census_b25140.py --year 2024 --output-dir build/household-economic-source-candidates/census
      - name: Capture official New York Fed workbook
        run: python scripts/acquire_household_economic_conditions.py --source nyfed --output-dir build/household-economic-source-candidates/nyfed
      - name: Observe exact New York Fed workbook structure
        run: |
          python scripts/inspect_nyfed_household_workbook.py \
            build/household-economic-source-candidates/nyfed/nyfed_ccp_debt_balance_by_class.raw \
            --output build/nyfed-workbook-structure-observation.json
      - name: Normalize exact-bound New York Fed class surfaces
        run: |
          python scripts/normalize_nyfed_household_workbook.py \
            build/household-economic-source-candidates/nyfed/nyfed_ccp_debt_balance_by_class.raw \
            --candidate-root build/household-economic-source-candidates/nyfed
      - name: Extract exact-bound New York Fed age distribution context
        run: |
          python scripts/extract_nyfed_distributional_context.py \
            build/household-economic-source-candidates/nyfed/nyfed_ccp_debt_balance_by_class.raw \
            --output build/nyfed-distributional-context.json
      - name: Inspect BEA credential presence without secret interpolation
        shell: bash
        run: |
          if [ -n "${BEA_API_KEY:-}" ]; then
            echo 'BEA_CREDENTIAL_ENVIRONMENT=PRESENT_UNEXPECTED_IN_HOSTED_VALIDATION'
            exit 1
          fi
          echo 'BEA_CREDENTIAL_ENVIRONMENT=ABSENT'
          echo 'BEA_CREDENTIAL_EXECUTION_BOUNDARY=TV_TVC_RESIDENT_ONLY'
          echo 'BEA_TV_TVC_REGISTRATION_EVIDENCE=NOT_OBSERVED'
      - name: Build partial non-authorizing household state candidate
        run: |
          python scripts/build_household_economic_state_candidate.py \
            --candidate-root build/household-economic-source-candidates \
            --output build/household-economic-state-candidate.json
      - name: Admit exact bounded required-cost and distribution context
        run: |
          python scripts/augment_household_economic_state_candidate.py \
            --state build/household-economic-state-candidate.json \
            --candidate-root build/household-economic-source-candidates \
            --nyfed-distribution build/nyfed-distributional-context.json
      - name: Verify semantic and authority boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('build/household-economic-state-candidate.json').read_text())
          if state.get('public_activation_authorized') is not False or state.get('evidence_state') != 'PARTIAL':
              raise SystemExit('state authority/evidence boundary violated')
          expected = {
              'net_disposable_resources':'UNKNOWN',
              'required_cost_burden':'PARTIAL',
              'necessary_consumption':'UNKNOWN',
              'discretionary_residual':'UNKNOWN',
              'saving_dissaving':'UNKNOWN',
              'new_borrowing':'UNKNOWN',
              'delinquency_arrears':'PARTIAL',
              'unmet_foregone_consumption':'UNKNOWN',
          }
          for key, value in expected.items():
              if state['household_state'][key]['state'] != value:
                  raise SystemExit(f'unexpected household state {key}: {state["household_state"][key]["state"]}')
          ids = {row['series_id'] for row in state['series']}
          for required in ('NYFED_CCP_DEBT_BALANCE_BY_AGE','NYFED_CCP_SERIOUS_DELINQUENCY_BY_AGE'):
              if required not in ids:
                  raise SystemExit(f'missing distribution series: {required}')
          if not any('Do not infer new borrowing' in x for x in state['interpretation']['prohibited_inferences']):
              raise SystemExit('new-borrowing prohibition missing')
          print('HOUSEHOLD_DISTRIBUTIONAL_CONTEXT=PASS')
          print('REQUIRED_COST_BURDEN=PARTIAL_HOUSING_ONLY')
          print('DELINQUENCY_ARREARS=PARTIAL_AGE_CONTEXT')
          print('NEW_BORROWING=UNKNOWN')
          print('PUBLIC_ACTIVATION_AUTHORIZED=false')
          PY
      - name: Upload bounded observation evidence
        uses: actions/upload-artifact@v4
        with:
          name: household-economic-current-candidates
          path: |
            build/household-economic-source-candidates/**
            build/nyfed-workbook-structure-observation.json
            build/nyfed-distributional-context.json
            build/household-economic-state-candidate.json
          if-no-files-found: error
