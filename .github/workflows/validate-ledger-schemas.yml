name: Validate Ledger Schemas

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-json-schemas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validator
        run: python -m pip install --upgrade jsonschema referencing
      - name: Validate sample political influence tree
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          schema = json.loads(Path("schemas/political-influence-tree.schema.json").read_text())
          sample = json.loads(Path("samples/political-influence-tree.sample.json").read_text())
          if list(Draft202012Validator(schema).iter_errors(sample)):
              raise SystemExit("Political influence tree sample failed validation")
          PY
      - name: Validate economic trajectory lanes and comparison boundaries
        run: python scripts/validate_economic_trajectories.py
      - name: Validate embedded source receipts
        run: python scripts/validate_source_receipts.py
      - name: Validate producer export examples
        run: python scripts/validate_producer_exports.py
      - name: Validate producer acknowledgments
        run: python scripts/validate_producer_acknowledgments.py
      - name: Verify governed producer adapter artifacts
        run: |
          test -s schemas/producer-adapter.schema.json
          test -s samples/producer-adapter.sample.json
          test -s config/producer-discovery.json
          test -s scripts/discover_producer_adapters.py
          test -s scripts/validate_producer_adapters.py
          echo "Verified governed producer adapter foundation artifacts."
      - name: Validate governed review gate without a receipt
        run: |
          rm -rf /tmp/governed-review
          python scripts/verify_governed_producer_review.py \
            --receipt /tmp/governed-review/nonexistent.json \
            --output /tmp/governed-review/activation.json
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('/tmp/governed-review/activation.json').read_text())
          if state['status'] != 'awaiting-governed-review':
              raise SystemExit('Missing review receipt did not preserve blocked state')
          if state['compendium_eligible'] or state['propagation_eligible']:
              raise SystemExit('Unreviewed producer record became eligible')
          if state['authority']['automation_created_decision']:
              raise SystemExit('Automation claimed review authority')
          PY
      - name: Generate and validate producer intake results
        run: |
          rm -rf /tmp/producer-intake-results /tmp/producer-intake-quarantine
          python scripts/process_producer_intake.py \
            --input producer_intake/incoming \
            --output /tmp/producer-intake-results \
            --quarantine /tmp/producer-intake-quarantine \
            --generated-at 2026-07-20T13:30:00Z
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          schema = json.loads(Path("schemas/producer-intake-result.schema.json").read_text())
          files = sorted(Path("/tmp/producer-intake-results").glob("ERL-INTAKE-*.json"))
          if not files:
              raise SystemExit("Producer intake emitted no result receipts")
          for path in files:
              document = json.loads(path.read_text())
              errors = list(Draft202012Validator(schema).iter_errors(document))
              if errors:
                  raise SystemExit(f"Producer intake result failed schema validation: {path}")
              if document["authority"]["may_promote"] or document["authority"]["may_classify_final"]:
                  raise SystemExit("Producer intake exceeded authority")
          PY
      - name: Validate validation result receipts
        run: python scripts/validate_validation_results.py
      - name: Validate activation state manifest
        run: python scripts/validate_activation_state.py
      - name: Validate governance patterns
        run: python scripts/validate_governance_patterns.py
      - name: Capture assessment Political Influence Tree validation
        id: assessment
        shell: bash
        run: |
          set +e
          python scripts/validate_assessment_trees.py > /tmp/assessment-validation.log 2>&1
          STATUS=$?
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          cat /tmp/assessment-validation.log
          exit 0
      - name: Upload assessment validation diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: assessment-validation-diagnostic
          path: /tmp/assessment-validation.log
          if-no-files-found: error
      - name: Enforce assessment Political Influence Tree validation
        run: test "${{ steps.assessment.outputs.status }}" = "0"
      - name: Validate primary-record intake queues
        run: python scripts/validate_primary_record_intake.py
      - name: Validate individualized force-event packets
        run: python scripts/validate_force_event_packets.py
      - name: Validate related repository network
        run: python scripts/validate_related_repository_network.py
      - name: Validate repository capability registry
        run: python scripts/validate_repository_capabilities.py
      - name: Validate repository contract audit registry
        run: python scripts/validate_repository_contract_audits.py
      - name: Validate portable evidence intake
        run: python scripts/validate_portable_evidence_intake.py
      - name: Validate recurring discovery foundation
        run: python scripts/validate_recurring_discovery.py
      - name: Validate governed source-family discovery
        run: python scripts/validate_source_family_discovery.py
      - name: Smoke-test live source-family indexes without publishing
        run: |
          python scripts/discover_source_family_links.py \
            --config config/source-families.json \
            --base-config config/source-adapters.json \
            --output /tmp/source-adapters.live.json \
            --receipt /tmp/source-family-discovery.live.json \
            --discovered-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('/tmp/source-family-discovery.live.json').read_text())
          if receipt['execution_status'] != 'PASS':
              raise SystemExit('No live source family was reachable')
          if receipt['successful_family_count'] < 1:
              raise SystemExit('Live smoke test retained no successful source family')
          if receipt['authority']['may_promote']:
              raise SystemExit('Live smoke test gained promotion authority')
          print(json.dumps({
              'successful_family_count': receipt['successful_family_count'],
              'failed_family_count': receipt['failed_family_count'],
              'new_adapter_count': receipt['new_adapter_count'],
              'families': [
                  {
                      'family_id': item['family_id'],
                      'fetch_status': item['fetch_status'],
                      'discovered_count': item['discovered_count'],
                      'error': item['error'],
                  }
                  for item in receipt['families']
              ],
          }, indent=2))
          PY
      - name: Upload live source-family smoke receipt
        uses: actions/upload-artifact@v4
        with:
          name: source-family-live-smoke
          path: /tmp/source-family-discovery.live.json
          if-no-files-found: error
      - name: Validate source adapter and archive capture automation
        run: python scripts/validate_source_capture.py
      - name: Validate deterministic incident clustering
        run: python scripts/validate_incident_clusters.py
      - name: Validate governed adjacency graph
        run: python scripts/validate_adjacency_graph.py
      - name: Generate deterministic backfill and variance outputs
        run: python scripts/generate_backfill_and_variance.py --generated-at 2026-07-20T06:00:00Z
      - name: Validate historical backfill and variance boundaries
        run: python scripts/validate_backfill_and_variance.py
      - name: Generate governed review assignments
        run: python scripts/generate_review_assignments.py
      - name: Validate review routing and promotion boundaries
        run: python scripts/validate_review_routing.py
      - name: Generate reviewed compendium and delivery manifests
        run: python scripts/generate_compendium_and_deliveries.py --generated-at 2026-07-20T06:00:00Z
      - name: Validate reviewed-only publication and delivery boundaries
        run: python scripts/validate_compendium_and_deliveries.py
      - name: Generate pending propagation verification
        run: python scripts/verify_destination_acknowledgments.py --generated-at 2026-07-20T06:00:00Z
      - name: Validate destination propagation contracts
        run: python scripts/validate_destination_propagation.py
      - name: Regenerate deterministic discovery-cycle example
        run: |
          python scripts/generate_discovery_cycle.py --config config/recurring-searches.example.json --started-at 2026-07-20T06:00:00Z --output /tmp/generated-cycle.json
          python - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path("discovery_cycles/generated/ERL-RECURRING-DISCOVERY-BASELINE-001--20260720-060000.json").read_text())
          generated = json.loads(Path("/tmp/generated-cycle.json").read_text())
          if generated != expected:
              raise SystemExit("Generated discovery-cycle content does not match fixture")
          PY
      - name: Run combined activation validation
        run: python scripts/run_activation_validation.py
