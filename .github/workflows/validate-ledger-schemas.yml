name: Validate Ledger Schemas

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-json-schemas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validator
        run: python -m pip install --upgrade jsonschema referencing

      - name: Validate sample political influence tree
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          checks = [
              (
                  Path("schemas/political-influence-tree.schema.json"),
                  Path("samples/political-influence-tree.sample.json"),
              )
          ]

          for schema_path, sample_path in checks:
              schema = json.loads(schema_path.read_text(encoding="utf-8"))
              sample = json.loads(sample_path.read_text(encoding="utf-8"))
              validator = Draft202012Validator(schema)
              errors = sorted(validator.iter_errors(sample), key=lambda error: list(error.path))
              if errors:
                  print(f"Validation failed for {sample_path} against {schema_path}")
                  for error in errors:
                      path = ".".join(str(part) for part in error.path) or "<root>"
                      print(f"- {path}: {error.message}")
                  raise SystemExit(1)
              print(f"Validated {sample_path} against {schema_path}")
          PY

      - name: Validate embedded source receipts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          source_schema = json.loads(Path("schemas/source-posture.schema.json").read_text(encoding="utf-8"))
          sample = json.loads(Path("samples/political-influence-tree.sample.json").read_text(encoding="utf-8"))
          validator = Draft202012Validator(source_schema)

          sources = sample.get("receipts", {}).get("sources", [])
          if not sources:
              print("No sources found in sample receipts")
              raise SystemExit(1)

          failed = False
          for index, source in enumerate(sources):
              errors = sorted(validator.iter_errors(source), key=lambda error: list(error.path))
              if errors:
                  failed = True
                  print(f"Source receipt {index} failed validation")
                  for error in errors:
                      path = ".".join(str(part) for part in error.path) or "<root>"
                      print(f"- {path}: {error.message}")
              else:
                  print(f"Validated source receipt {index}")

          if failed:
              raise SystemExit(1)
          PY

      - name: Validate standalone source receipts
        run: python scripts/validate_source_receipts.py

      - name: Validate producer export examples
        run: python scripts/validate_producer_exports.py

      - name: Validate producer acknowledgments
        run: python scripts/validate_producer_acknowledgments.py

      - name: Validate validation result receipts
        run: python scripts/validate_validation_results.py

      - name: Validate activation state manifest
        run: python scripts/validate_activation_state.py

      - name: Validate governance patterns
        run: python scripts/validate_governance_patterns.py

      - name: Validate assessment Political Influence Trees
        run: python scripts/validate_assessment_trees.py

      - name: Validate primary-record intake queues
        run: python scripts/validate_primary_record_intake.py

      - name: Validate individualized force-event packets
        run: python scripts/validate_force_event_packets.py

      - name: Validate related repository network
        run: python scripts/validate_related_repository_network.py

      - name: Validate repository capability registry
        run: python scripts/validate_repository_capabilities.py

      - name: Validate repository contract audit registry
        run: python scripts/validate_repository_contract_audits.py

      - name: Validate portable evidence intake
        run: python scripts/validate_portable_evidence_intake.py

      - name: Validate recurring discovery foundation
        run: python scripts/validate_recurring_discovery.py

      - name: Regenerate deterministic discovery-cycle example
        run: |
          python scripts/generate_discovery_cycle.py \
            --config config/recurring-searches.example.json \
            --started-at 2026-07-20T06:00:00Z \
            --output /tmp/generated-cycle.json
          diff -u discovery_cycles/generated/ERL-RECURRING-DISCOVERY-BASELINE-001--20260720-060000.json /tmp/generated-cycle.json

      - name: Run combined activation validation
        run: python scripts/run_activation_validation.py
