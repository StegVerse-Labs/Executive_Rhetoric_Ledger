name: Run Recurring Discovery

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/run-recurring-discovery.yml"
      - "config/source-families.json"
      - "schemas/source-family.schema.json"
      - "scripts/discover_source_family_links.py"
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: recurring-discovery
  cancel-in-progress: false

jobs:
  capture-and-propose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validator
        run: python -m pip install --upgrade jsonschema referencing
      - name: Generate governed discovery cycle
        id: cycle
        run: |
          STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          OUTPUT="$(python scripts/generate_discovery_cycle.py --config config/recurring-searches.example.json --started-at "$STARTED_AT")"
          echo "started_at=$STARTED_AT" >> "$GITHUB_OUTPUT"
          echo "cycle_path=$OUTPUT" >> "$GITHUB_OUTPUT"
      - name: Discover governed source-family links
        run: |
          python scripts/discover_source_family_links.py \
            --config config/source-families.json \
            --base-config config/source-adapters.json \
            --output config/source-adapters.runtime.json \
            --receipt discovery_cycles/source-family-discovery.latest.json \
            --discovered-at "${{ steps.cycle.outputs.started_at }}"
      - name: Capture configured and discovered sources
        run: python scripts/run_source_capture.py --config config/source-adapters.runtime.json --captured-at "${{ steps.cycle.outputs.started_at }}"
      - name: Deduplicate and cluster candidates
        run: python scripts/cluster_discovery_candidates.py
      - name: Generate adjacency and historical-link candidates
        run: python scripts/generate_adjacency_graph.py
      - name: Generate historical backfill and variance candidates
        run: python scripts/generate_backfill_and_variance.py --generated-at "${{ steps.cycle.outputs.started_at }}"
      - name: Route governed reviews and prepare promotion candidates
        run: python scripts/generate_review_assignments.py
      - name: Generate reviewed compendium and delivery manifests
        run: python scripts/generate_compendium_and_deliveries.py --generated-at "${{ steps.cycle.outputs.started_at }}"
      - name: Validate generated state
        run: |
          python scripts/validate_recurring_discovery.py
          python scripts/validate_source_family_discovery.py
          python scripts/validate_source_capture.py
          python scripts/validate_incident_clusters.py
          python scripts/validate_adjacency_graph.py
          python scripts/validate_backfill_and_variance.py
          python scripts/validate_review_routing.py
          python scripts/validate_compendium_and_deliveries.py
          python scripts/run_activation_validation.py
      - name: Publish reviewed-only canonical outputs
        run: |
          git config user.name "stegverse-publication-bot"
          git config user.email "stegverse-publication-bot@users.noreply.github.com"
          git checkout main
          git add publication delivery_manifests
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish reviewed Executive Rhetoric Ledger compendium"
            git push origin main
          fi
      - name: Create or update governed candidate branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="automation/recurring-discovery"
          git checkout -B "$BRANCH" main
          git add archive discovery_candidates discovery_cycles/generated discovery_cycles/source-family-discovery.latest.json incident_clusters adjacency_graphs backfill_queues variance_candidates review_assignments promotion_candidates
          if git diff --cached --quiet; then
            echo "No new governed discovery candidate state."
            exit 0
          fi
          git commit -m "chore: record automated recurring discovery candidate state"
          git push --force-with-lease origin "$BRANCH"
          BODY="Generated by the governed recurring-discovery workflow. Candidate outputs remain review-required. Source-family discovery is allowlisted and cannot promote records. Canonical publication on main contains reviewed receipts only."
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --title "Automated recurring discovery candidates" --body "$BODY"
          else
            gh pr create --base main --head "$BRANCH" --title "Automated recurring discovery candidates" --body "$BODY"
          fi
