name: Validate Person Event Evaluation Registry v1

on:
  push:
    paths:
      - 'standards/person-event-current-state-evaluation.v1.md'
      - 'coordination/person-event-evaluation-registry.v1.json'
      - 'scripts/validate_person_event_evaluation_registry_v1.py'
      - '.github/workflows/validate-person-event-evaluation-registry-v1.yml'
  pull_request:
    paths:
      - 'standards/person-event-current-state-evaluation.v1.md'
      - 'coordination/person-event-evaluation-registry.v1.json'
      - 'scripts/validate_person_event_evaluation_registry_v1.py'
      - '.github/workflows/validate-person-event-evaluation-registry-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_person_event_evaluation_registry_v1.py
