name: Capture Ellis-Scavino Validation Evidence

on:
  push:
    branches:
      - main
    paths:
      - "scripts/capture_validation_evidence.py"
      - "scripts/validate_assessment_trees.py"
      - "scripts/validate_primary_record_intake.py"
      - "scripts/run_activation_validation.py"
      - "schemas/**"
      - "assessments/**"
      - "research-candidates/2026-07-30-jenna-ellis-scavino-transfer-of-power-chain.md"
      - "validation_results/ellis-scavino-transfer-assessment.pending.json"
      - ".github/workflows/capture-ellis-scavino-validation-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  EVIDENCE_DIR: validation_evidence/ellis-scavino/${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  capture-validation-evidence:
    name: Capture governed validator evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validator dependencies
        run: python -m pip install --upgrade jsonschema referencing

      - name: Run validators and create evidence packet
        id: capture
        run: |
          python scripts/capture_validation_evidence.py \
            --topic-id PIT-MODERN-2026-ELLIS-SCAVINO-TRANSFER \
            --output "$EVIDENCE_DIR"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              (Path(os.environ["EVIDENCE_DIR"]) / "validation-execution-receipt.json").read_text()
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
              stream.write(f"conclusion={receipt['overall_conclusion']}\n")
              failed = receipt.get("first_failed_validator") or ""
              stream.write(f"first_failed_validator={failed}\n")
          PY

      - name: Upload complete validation evidence packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ellis-scavino-validation-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 90

      - name: Publish execution summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["EVIDENCE_DIR"]) / "validation-execution-receipt.json"
          if not path.exists():
              print("## Ellis-Scavino validator evidence\n\nEvidence receipt was not generated.")
              raise SystemExit(0)
          receipt = json.loads(path.read_text())
          env = receipt["execution_environment"]
          print("## Ellis-Scavino validator evidence")
          print(f"- Commit: `{env['head_commit']}`")
          print(f"- Run ID: `{env['run_id']}`")
          print(f"- Run attempt: `{env['run_attempt']}`")
          print(f"- Event: `{env['event_name']}`")
          print(f"- Conclusion: `{receipt['overall_conclusion']}`")
          print(f"- First failed validator: `{receipt.get('first_failed_validator') or 'none'}`")
          print("\n| Validator | Command | Exit code | Conclusion |")
          print("|---|---|---:|---|")
          for item in receipt["validators"]:
              print(
                  f"| {item['name']} | `{item['command_text']}` | "
                  f"{item['exit_code']} | {item['conclusion']} |"
              )
          PY

      - name: Enforce validator result
        if: always()
        run: |
          test -f "$EVIDENCE_DIR/validation-execution-receipt.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              (Path(os.environ["EVIDENCE_DIR"]) / "validation-execution-receipt.json").read_text()
          )
          if receipt["overall_conclusion"] != "success":
              raise SystemExit(
                  f"Validator evidence packet records failure; first failed validator: "
                  f"{receipt.get('first_failed_validator')}"
              )
          print("PASS: all governed Ellis-Scavino validators completed with exit code 0")
          PY
