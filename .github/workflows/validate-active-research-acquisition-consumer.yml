name: Validate Active Research Acquisition Consumer

on:
  pull_request:
    paths:
      - "scripts/consume_active_research_acquisition.py"
      - "scripts/build_active_research_intr_binding.py"
      - "tests/test_active_research_acquisition_consumer.py"
      - "tests/test_active_research_intr_binding.py"
      - ".github/workflows/validate-active-research-acquisition-consumer.yml"
      - "docs/ACTIVE_RESEARCH_MYKV_DISPATCH_MIRROR_HANDOFF.md"
      - "docs/ERL_KV_STORAGE_MIRROR_HANDOFF.md"
      - "README.md"
  push:
    branches: [main]
    paths:
      - "scripts/consume_active_research_acquisition.py"
      - "scripts/build_active_research_intr_binding.py"
      - "tests/test_active_research_acquisition_consumer.py"
      - "tests/test_active_research_intr_binding.py"
      - ".github/workflows/validate-active-research-acquisition-consumer.yml"
      - "docs/ACTIVE_RESEARCH_MYKV_DISPATCH_MIRROR_HANDOFF.md"
      - "docs/ERL_KV_STORAGE_MIRROR_HANDOFF.md"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: Run acquisition consumer and runtime-binding tests
        run: >-
          python -m pytest -q
          tests/test_active_research_acquisition_consumer.py
          tests/test_active_research_intr_binding.py
